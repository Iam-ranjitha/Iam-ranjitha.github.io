about:
  - I'm a project coordinator based in Kochi, with a background in Agile delivery across software, CMS, mobile app and automotive projects. My work covers project planning, schedule tracking, risk and status reporting, and keeping clients, stakeholders and delivery teams aligned from kickoff to release.
  - I specialize in Agile methodologies, continuous improvement and quality delivery. I build strong relationships with clients, stakeholders and team members, because clear communication and a customer-focused approach are essential for success.
  - I'm actively learning Generative AI, AI models and related tools, and exploring how they can improve project management and delivery processes. I enjoy using technology and new ideas to solve business problems.
  - Beyond my day job, I'm a PMI member, a member of the Kochi Branch Council of the PMI Kerala Chapter, and a volunteer with the AWS User Group Kochi.
offWork: Outside of work, I enjoy listening to music, travelling, painting, and exploring creative outlets that keep me balanced and inspired.
